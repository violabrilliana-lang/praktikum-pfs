<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Praktikum Bootstrap - Tugas 5</title>

    <!-- Bootstrap CSS (File Lokal sesuai Poin 2.2 Modul) -->
    <link href="pemrograman-fullstack/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Cadangan CDN (Supaya di Live Server langsung berwarna & rapi) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- 1. NAVBAR (Komponen Modul Poin 2.5) -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Praktikum 5</a>
      </div>
    </nav>

    <!-- 2. STRUKTUR DASAR & HEADER (Modul Poin 2.3) -->
    <div class="container text-center mt-5">
      <h1 class="text-primary">Halo, Bootstrap!</h1>
      <p class="text-secondary">
        Ini adalah halaman pertama dengan Bootstrap 5
      </p>
      <button class="btn btn-success">Tombol Hijau</button>
    </div>

    <!-- 3. GRID SYSTEM 6 KOLOM (Modul Poin 2.4) -->
    <div class="container mt-4">
      <div class="row">
        <div
          class="col-12 col-sm-6 col-md-4 col-lg-2 bg-primary text-white p-3"
        >
          Column
        </div>
        <div
          class="col-12 col-sm-6 col-md-4 col-lg-2 bg-success text-white p-3"
        >
          Column
        </div>
        <div class="col-12 col-sm-6 col-md-4 col-lg-2 bg-warning text-dark p-3">
          Column
        </div>
        <div class="col-12 col-sm-6 col-md-4 col-lg-2 bg-info text-dark p-3">
          Column
        </div>
        <div class="col-12 col-sm-6 col-md-4 col-lg-2 bg-light text-dark p-3">
          Column
        </div>
        <div class="col-12 col-sm-6 col-md-4 col-lg-2 bg-dark text-white p-3">
          Column
        </div>
      </div>
    </div>

    <!-- 4. KOMPONEN TOMBOL / BUTTON (Modul Poin 2.5) -->
    <div class="container text-center mt-5">
      <button class="btn btn-primary me-2">Primary</button>
      <button class="btn btn-danger me-2">Danger</button>
      <button class="btn btn-secondary me-2">Secondary</button>
      <button class="btn btn-success me-2">Success</button>
      <button class="btn btn-warning text-dark me-2">Warning</button>
      <button class="btn btn-info text-white me-2">Info</button>
      <button class="btn btn-light text-dark me-2">Light</button>
      <button class="btn btn-dark me-2">Dark</button>
      <button class="btn btn-outline-primary me-2">Outline Primary</button>
      <button class="btn btn-link me-2">Link</button>

      <div class="mt-3">
        <button class="btn btn-primary btn-lg me-2">Large</button>
        <button class="btn btn-secondary btn-sm me-2">Small</button>
        <button class="btn btn-primary disabled" aria-disabled="true">
          Disabled
        </button>
      </div>
    </div>

    <!-- 5. KOMPONEN CARD (Modul Poin 2.5) -->
    <div class="container mt-5">
      <div class="card" style="width: 18rem">
        <img
          src="https://picsum.photos/300/200"
          class="card-img-top"
          alt="gambar"
        />
        <div class="card-body">
          <h5 class="card-title">Judul Card</h5>
          <p class="card-text">Deskripsi singkat isi card.</p>
          <a href="#" class="btn btn-primary">Lihat Detail</a>
        </div>
      </div>
    </div>

    <!-- 6. KOMPONEN FORM INPUT (Modul Poin 2.5) -->
    <div class="container mt-4 mb-5">
      <form>
        <div class="mb-3">
          <label class="form-label">Nama</label>
          <input type="text" class="form-control" placeholder="Masukkan nama" />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            placeholder="Masukkan email"
          />
        </div>
        <button type="submit" class="btn btn-success">Kirim</button>
      </form>
    </div>

    <!-- Bootstrap JS (File Lokal & CDN) -->
    <script src="pemrograman-fullstack/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
